name: NC website checks
on:
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/tests/website.test.cjs
      - run: node --check assets/site.js
